services:
  api:
    build: ./api
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=file:/data/dev.db
    volumes:
      - sqlite-data:/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - API_URL=http://api:4000
    depends_on:
      - api

volumes:
  sqlite-data: